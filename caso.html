<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuéntanos tu caso · Relevo</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fafaf8"><meta name="color-scheme" content="only light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@72,600&text=Relevo&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fafaf8;--surface:#fff;--ink:#131f33;--muted:#4b5567;--soft:#7a8394;--line:#e7e4de;--line-strong:#cfc9bf;
  --navy:#26497c;--navy-tint:#edf2f9;--accent:#f08a4b;--accent-hover:#f49a62;--accent-deep:#df6f30;--accent-tint:#fcebdf;--err:#b3261e;
  --head:"Archivo","Helvetica Neue",Arial,sans-serif;--body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:25px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;line-height:1}
.mark{position:relative;width:24px;height:24px;flex:none}
.mark i{position:absolute;height:6.5px;border-radius:1.5px}
.mark i:nth-child(1){left:0;top:5px;width:16px;background:var(--navy)}
.mark i:nth-child(2){left:8px;top:13px;width:16px;background:var(--accent)}
.lock{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:6px}
.bar{height:3px;background:var(--line);max-width:760px;margin:0 auto 0;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}
main{max-width:640px;margin:0 auto;padding:40px 24px 120px;min-height:70vh}
.step{animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;font-weight:600;color:var(--accent-deep);letter-spacing:.02em;margin:0 0 10px}
h1{font-family:var(--head);font-weight:700;font-stretch:88%;font-size:clamp(30px,6.4vw,42px);line-height:1.06;letter-spacing:-.025em;margin:0 0 16px}
h2{font-family:var(--head);font-weight:650;font-stretch:92%;font-size:clamp(23px,4.6vw,29px);line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
p{margin:0 0 14px;color:var(--muted)}
.hint{font-size:14.5px;color:var(--soft);margin:0 0 22px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{appearance:none;text-align:left;width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font:500 16.5px/1.35 var(--body);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--line-strong)}
.opt:active{transform:scale(.995)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:600 12px var(--body);color:var(--soft)}
.opt .k{border-radius:50%}
.opt.multi .k{border-radius:6px}
.opt.multi[aria-pressed=true] .k::after{content:'';width:9px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt.multi[aria-pressed=true] .k{font-size:0}
.multi-tag{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--body);color:var(--navy);background:var(--navy-tint);border-radius:999px;padding:5px 11px;margin:2px 0 4px}
.multi-tag svg{flex:none}
.opt[aria-pressed=true]{border-color:var(--navy);background:var(--navy-tint)}
.opt[aria-pressed=true] .k{background:var(--navy);border-color:var(--navy);color:#fff}
.nav{display:flex;align-items:center;gap:14px;margin-top:26px}
.btn{appearance:none;border:0;border-radius:8px;min-height:50px;padding:0 24px;font:600 16.5px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.btn-primary{background:var(--accent);color:var(--ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.back{appearance:none;border:0;background:none;color:var(--soft);font:500 15px var(--body);cursor:pointer;padding:8px 0}
.back:hover{color:var(--ink)}
.facts{display:grid;gap:12px;margin:26px 0 30px;padding:0;list-style:none}
.facts li{display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:16px}
.facts b{color:var(--ink);font-weight:600}
.dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-top:9px}
.note{font-size:13.5px;color:var(--soft);margin-top:18px}
.err{color:var(--err);font-size:15px}
.center{text-align:left}
.sig{margin-top:28px;font-size:15px;color:var(--muted)}
.sig b{color:var(--ink)}
.skel{height:18px;border-radius:6px;background:linear-gradient(90deg,#eeece7,#f6f5f1,#eeece7);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:520px){main{padding-top:28px}.top{padding:16px}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Relevo"><span class="mark" aria-hidden="true"><i></i><i></i></span>Relevo</a>
  <span class="lock"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Confidencial</span>
</header>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<main id="app" aria-live="polite"><div class="skel" style="width:40%"></div><div class="skel" style="width:85%;height:38px"></div><div class="skel" style="width:70%"></div></main>

<script>
(function(){
const CFG={url:'https://zxjqixxpyxdyrqaweorn.supabase.co',key:'sb_publishable_zEwtzlpxk2cogjK0KCIMdg_xbPhTNPE'};
const codigo=new URLSearchParams(location.search).get('c')||'';
const DEMO=codigo==='demo';
const $app=document.getElementById('app'), $bar=document.getElementById('bar');
const TITULOS=new Set(['sr','sra','srta','don','dona','doña','dr','dra','ing','lic','arq']);
const NO_NOMBRE=new Set(['gerencia','gerente','admin','administracion','administración','info','contacto','ventas','empresa','prueba','test','na','ninguno','usuario','cliente','propietario','dueno','dueño']);
const NO_EMPRESA=/^((una|mi|la|nuestra) empresa.*|(una|mi) (compañía|compania|firma|sociedad|negocio).*|n\/?a|no|ninguna|ninguno|empresa|privad[ao]|confidencial|prueba|test|x+|\.+|-+|sin nombre|no aplica|reservad[ao]|educaci[oó]n|salud|comercio|transporte|construcci[oó]n|servicios|restaurante|alimentos|tecnolog[ií]a|agro|manufactura|log[ií]stica|turismo|retail)$/i;
const titulo=w=>(w.length<=3&&w===w.toUpperCase()&&/[A-ZÁÉÍÓÚÑ]/.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
// Si el nombre o la empresa no se ven confiables, el texto queda genérico (mismas reglas que la app).
function nombrePila(n){const ws=String(n??'').replace(/^[^\p{L}]+/u,'').replace(/^PRUEBA\s+/i,'').trim().split(/\s+/).filter(Boolean);while(ws.length&&TITULOS.has(ws[0].replace(/\./g,'').toLowerCase()))ws.shift();const w=ws[0]||'';if(!/^[\p{L}'’]{2,20}$/u.test(w)||NO_NOMBRE.has(w.toLowerCase()))return '';return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}
function empresaLimpia(e){let t=String(e??'').replace(/^[^\p{L}\p{N}]+/u,'').replace(/^PRUEBA\s+/i,'').replace(/\(.*?\)/g,'').replace(/[*]+/g,'').split(/[,;|]/)[0].trim();t=t.replace(/\s+(s\.?\s?a\.?\s?s\.?|s\.?\s?a\.?|ltda\.?|e\.?\s?u\.?|s\.?\s?en\s?c\.?|bic)\.?$/i,'').replace(/\s+(s\.?\s?a\.?\s?s\.?)$/i,'').trim();if(t.length<3||t.length>60||NO_EMPRESA.test(t)||/@|https?:|www\./i.test(t)||!/\p{L}/u.test(t))return '';if(t===t.toUpperCase())t=t.split(/\s+/).map(titulo).join(' ');return t;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Preguntas. "si" decide si se muestra según respuestas anteriores.
const conOferta=r=>r.oferta&&r.oferta!=='no';
const Q=[
  {k:'oferta',t:'En los últimos 12 meses, ¿alguien te propuso comprar tu empresa o una parte de ella?',o:[['concreta','Sí, con una oferta concreta'],['informal','Sí, pero de manera informal'],['no','No']]},
  {k:'quien',t:'¿Quién era?',m:9,si:conOferta,o:[['empleado','Un empleado o el gerente'],['socio','Un socio'],['familiar','Un familiar'],['competidor','Un competidor'],['proveedor','Un proveedor'],['cliente','Un cliente'],['inversionista','Un inversionista o fondo'],['otro','Otra persona']]},
  {k:'avance',t:'¿Hasta dónde llegó esa conversación?',si:conOferta,o:[['mencion','Solo se mencionó'],['precio','Hablamos de precio'],['pago','Hablamos de cómo se pagaría'],['casi','Casi cerramos'],['cayo','Se cayó']]},
  {k:'freno',t:'¿Qué ha impedido cerrarla?',m:9,si:conOferta,o:[['plata','El comprador no tenía toda la plata'],['precio','No nos pusimos de acuerdo en el precio'],['confianza','No me sentí seguro con el proceso'],['legal','No sé cómo hacerlo legalmente'],['impuestos','Los impuestos'],['no_listo','Todavía no estoy listo'],['otro','Otra razón']]},
  {k:'precio_def',t:'¿Cómo definiste, o cómo definirías, el precio de tu empresa?',o:[['creo','Lo que yo creo que vale'],['contador','Lo que me dice mi contador'],['oferta','Lo que me ofrezcan'],['valoracion','Con una valoración profesional'],['no','Todavía no lo he pensado']]},
  {k:'cuotas',t:'¿Aceptarías recibir parte del precio en cuotas, pagadas con las utilidades de la empresa?',o:[['si','Sí'],['garantias','Sí, si hay garantías'],['no','No, lo quiero todo al cierre']]},
  {k:'seguridad',t:'Si ya tuvieras comprador, ¿qué te haría sentir seguro para cerrar?',m:2,o:[['precio_justo','Saber que el precio es justo'],['contrato','Un contrato bien hecho'],['pago_garantizado','Que el pago esté garantizado'],['negociador','Alguien que negocie por mí'],['impuestos','Que los impuestos queden bien manejados']]},
  {k:'utilidad',sec:'Ahora, sobre la empresa',t:'¿Cuánto deja la empresa al año, antes de impuestos?',h:'Un rango aproximado es suficiente.',o:[['perdida','Pierde o queda en cero'],['lt100','Menos de $100 millones'],['100_250','$100 a $250 millones'],['250_500','$250 a $500 millones'],['gt500','Más de $500 millones'],['nd','Prefiero no decir']]},
  {k:'tendencia',t:'En los últimos tres años, las ventas…',o:[['crece','Vienen creciendo'],['estable','Se mantienen'],['baja','Vienen bajando']]},
  {k:'deuda',t:'¿Cuánta deuda financiera tiene la empresa?',o:[['ninguna','Ninguna'],['lt200','Menos de $200 millones'],['200_500','$200 a $500 millones'],['gt500','Más de $500 millones'],['nd','Prefiero no decir']]},
  {k:'dependencia',t:'Si te ausentaras tres meses, ¿la empresa seguiría funcionando bien?',o:[['si','Sí, sin problema'],['parcial','Más o menos'],['no','No, depende mucho de mí']]},
  {k:'concentracion',t:'¿Algún cliente representa más del 30% de las ventas?',o:[['no','No'],['si','Sí']]},
  {k:'contabilidad',t:'¿Cómo está la contabilidad?',o:[['formal','Formal, con contador y declaración al día'],['mixta','Formal en parte'],['informal','Mayormente informal']]},
  {k:'que_vende',t:'¿Qué te gustaría vender?',o:[['todo','La empresa completa'],['mayoria','La mayoría, y me quedo con una parte'],['socio','Que entre un socio con una parte'],['nose','Todavía no lo sé']]},
  {k:'transicion',t:'¿Acompañarías al nuevo dueño durante la transición?',o:[['si','Sí, el tiempo que haga falta'],['corto','Sí, unos pocos meses'],['no','Prefiero salir de inmediato']]},
  {k:'llamada',si:conOferta,t:'Última: ¿te podemos llamar 15 minutos para entender mejor tu caso?',o:[['si','Sí, con gusto'],['no','Por ahora no']]},
];

let datos=null, r={}, i=-1, enviando=false;
const visibles=()=>Q.filter(q=>!q.si||q.si(r));
const progreso=()=>{const v=visibles();const idx=i<0?0:v.indexOf(Q[i])+1;$bar.style.width=(i<0?3:Math.round(idx/(v.length+1)*100))+'%';};

function rpc(fn,body){return fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.ok?x.json():Promise.reject(x.status));}

function inicio(){
  const n=nombrePila(datos.nombre), emp=empresaLimpia(datos.empresa);
  $app.innerHTML=`<section class="step center">
    <p class="kicker">Tu caso</p>
    <h1>${n?'Hola, '+esc(n)+'. ':''}Queremos acompañarte en la venta${emp?' de '+esc(emp):' de tu empresa'}.</h1>
    <p>Ya tienes tu valoración flash. Para atenderte bien necesitamos entender tu situación: con estas respuestas revisamos tu caso y definimos cómo te podemos ayudar.</p>
    <ul class="facts">
      <li><span class="dot"></span><span><b>4 minutos.</b> Casi todo se responde con un toque.</span></li>
      <li><span class="dot"></span><span><b>Rangos, no cifras exactas.</b> No te pedimos documentos.</span></li>
      <li><span class="dot"></span><span><b>Confidencial.</b> Solo lo ve el equipo de Relevo.</span></li>
    </ul>
    <button class="btn btn-primary" id="go">Contar mi caso <span aria-hidden="true">→</span></button>
    <p class="note">Damos prioridad a los casos de quienes nos cuentan su situación.</p>
  </section>`;
  document.getElementById('go').onclick=()=>ir(primero());
  i=-1;progreso();
}
const primero=()=>Q.indexOf(visibles()[0]);
function siguienteDe(idx){for(let j=idx+1;j<Q.length;j++){if(!Q[j].si||Q[j].si(r))return j;}return -1;}
function anteriorDe(idx){for(let j=idx-1;j>=0;j--){if(!Q[j].si||Q[j].si(r))return j;}return -2;}

function ir(idx){
  if(idx===-1)return enviar();
  if(idx===-2)return inicio();
  i=idx;const q=Q[i];progreso();
  const sel=r[q.k];const multi=!!q.m;
  const marcado=k=>multi?(sel||[]).includes(k):sel===k;
  const letras='ABCDEFGHIJ';
  $app.innerHTML=`<section class="step">
    ${q.sec?`<p class="kicker">${esc(q.sec)}</p>`:''}
    <h2 id="qt">${esc(q.t)}</h2>
    ${multi?`<p class="multi-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>${q.m===2?'Elige hasta dos opciones':'Puedes elegir varias opciones'}</p>`:''}${q.h?`<p class="hint">${esc(q.h)}</p>`:''}
    <div class="opts" role="${multi?'group':'radiogroup'}" aria-labelledby="qt">
      ${q.o.map(([k,l],n)=>`<button type="button" class="opt${multi?' multi':''}" data-k="${k}" aria-pressed="${marcado(k)}"><span class="k">${letras[n]}</span>${esc(l)}</button>`).join('')}
    </div>
    <div class="nav">
      <button class="btn btn-primary" id="next" ${(multi?(sel||[]).length:sel)?'':'disabled'}>${siguienteDe(i)===-1?'Enviar':'Continuar'} <span aria-hidden="true">→</span></button>
      <button class="back" id="back">← Atrás</button>
    </div>
  </section>`;
  $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>elegir(q,b.dataset.k));
  document.getElementById('back').onclick=()=>ir(anteriorDe(i));
  document.getElementById('next').onclick=()=>ir(siguienteDe(i));
  window.scrollTo({top:0,behavior:'smooth'});
}
function elegir(q,k){
  if(q.m){
    let s=r[q.k]||[];
    if(s.includes(k)) s=s.filter(x=>x!==k);
    else { if(q.m>1&&s.length>=q.m) s=s.slice(1); s=[...s,k]; }
    r[q.k]=s;
    $app.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',s.includes(b.dataset.k)));
    document.getElementById('next').disabled=!s.length;
    return;
  }
  r[q.k]=k;
  if(q.k==='oferta'&&k==='no'){delete r.quien;delete r.avance;delete r.freno;delete r.llamada;}
  $app.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  const nx=document.getElementById('next'); nx.disabled=false; nx.firstChild.textContent=(siguienteDe(i)===-1?'Enviar':'Continuar')+' ';
}
function enviar(){
  if(enviando)return; enviando=true; $bar.style.width='100%';
  $app.innerHTML=`<section class="step"><h2>Guardando tus respuestas…</h2></section>`;
  const p=DEMO?Promise.resolve(true):rpc('formulario_responder',{c:codigo,r:Object.assign({v:1},r)});
  p.then(ok=>{ if(!ok) throw 0; gracias(); }).catch(()=>{ enviando=false;
    $app.innerHTML=`<section class="step"><h2>No pudimos guardar tus respuestas.</h2><p class="err">Revisa tu conexión e inténtalo de nuevo.</p><div class="nav"><button class="btn btn-primary" id="re">Reintentar</button></div></section>`;
    document.getElementById('re').onclick=enviar; });
}
function gracias(){
  const n=nombrePila(datos.nombre), emp=empresaLimpia(datos.empresa);
  const llamar=r.llamada==='si';
  $app.innerHTML=`<section class="step">
    <p class="kicker">Recibido</p>
    <h1>Gracias${n?', '+esc(n):''}.</h1>
    <p>Ya tenemos tu caso${emp?' y el de '+esc(emp):''}. Lo revisamos personalmente.</p>
    <p>${llamar?'Te escribimos en los próximos días hábiles para coordinar la llamada.':'Te escribimos en los próximos días hábiles con lo que vemos para tu caso.'}</p>
    <p class="sig"><b>J. Felipe Pardo</b><br>Fundador, Relevo</p>
  </section>`;
}
function invalido(msg){$app.innerHTML=`<section class="step"><h2>${msg}</h2><p>Si recibiste este enlace de Relevo, respóndenos el correo y te ayudamos.</p></section>`;$bar.style.width='0';}

if(DEMO){const u=new URLSearchParams(location.search);datos={nombre:u.has('n')?u.get('n'):'Mario Ospina',empresa:u.has('e')?u.get('e'):'BIODEGRADABLES ECOGREEN SAS'};inicio();}
else if(codigo.length<16) invalido('Este enlace no es válido.');
else rpc('formulario_datos',{c:codigo}).then(d=>{ if(!d) return invalido('Este enlace no es válido o ya venció.');
  datos=d; if(d.respondido){ $app.innerHTML=`<section class="step"><p class="kicker">Ya lo respondiste</p><h1>Gracias${nombrePila(d.nombre)?', '+esc(nombrePila(d.nombre)):''}.</h1><p>Ya tenemos tu caso y lo estamos revisando. Si quieres corregir algo, puedes responder de nuevo.</p><div class="nav"><button class="btn btn-primary" id="go">Responder de nuevo</button></div></section>`; document.getElementById('go').onclick=inicio; } else inicio();
}).catch(()=>invalido('No pudimos cargar el formulario.'));

document.addEventListener('keydown',e=>{ if(i<0)return; const q=Q[i]; const n='abcdefghij'.indexOf(e.key.toLowerCase()); if(n>=0&&n<q.o.length) elegir(q,q.o[n][0]); if(e.key==='Enter'&&(q.m?(r[q.k]||[]).length:r[q.k])) ir(siguienteDe(i)); });
})();
</script>
</body>
</html>
